[project]
name = "qem"
dynamic = ["version"]
description = "Python library and CLI for NoMac cloud Macs (nomac.app)"
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE", "LICENSES/*"]
authors = [
    { name = "René de Hesselle", email = "dehesselle@web.de" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27",
    "pathspec>=1.1.1",
    "pomona>=0.1",
    "websockets>=17.1",
]

[project.scripts]
qem = "qem.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/qem/version.py"

[tool.ruff]
# Ruff comes from outside the project, and its defaults change between minor
# releases; bump this once a new minor's findings have been reviewed, together
# with the pin in .github/workflows/build.yml.
required-version = "~=0.16.0"
# Generated by hatch-vcs.
extend-exclude = ["src/qem/version.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
