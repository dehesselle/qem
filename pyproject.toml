[project]
name = "qem"
dynamic = ["version"]
description = "Python library and CLI for NoMac cloud Macs (nomac.app)"
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE"]
authors = [
    { name = "René de Hesselle", email = "dehesselle@web.de" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pathspec>=1.1.1",
    "websockets>=17.1",
]

[project.scripts]
qem = "qem.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/qem/version.py"

[tool.ruff]
# Generated by hatch-vcs.
extend-exclude = ["src/qem/version.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
